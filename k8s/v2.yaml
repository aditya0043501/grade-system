apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-v2
  template:
    metadata:
      labels:
        app: grade-v2
    spec:
      containers:
        - name: grade
          image: your_dockerhub_username/grade-system:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: grade-v2-svc
spec:
  type: NodePort
  selector:
    app: grade-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002
